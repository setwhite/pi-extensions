packages:
  - 'packages/*'

# 三个包原来各写一份，现在只能写在这里：子目录的 pnpm-workspace.yaml 被忽略，
# 缺 allowBuilds 时 pnpm 会以 ERR_PNPM_IGNORED_BUILDS 直接失败。
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.3.0'
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/pi-codemode@1.3.0'
  - '@earendil-works/pi-coding-agent@1.3.0'
  - '@earendil-works/pi-mcp@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
  - '@earendil-works/pi-tui@1.3.0'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - typebox@1.4.0
  - vitest@5.0.5

# pi-coding-agent 把 undici 精确钉死 8.10.2，命中 GHSA-xjj6-f33q-929c（high）
# 与 GHSA-f72v-6w45-q472。上游改口之前，只能在这里强制升到修复版。
# 发布物 dependencies 各自声明，override 只作用于开发与 CI 安装出来的那一份。
overrides:
  undici: 8.12.3
