# CI：风格闸 + 依赖图闸 + 类型检查 + 全部测试。三个包各跑各的四步闸，--no-bail 互不阻塞。
# 矩阵：Linux 覆盖 Node 22 / 24（宿主要求 >= 22.19.0，见 package.json engines），Windows 覆盖 Node 22。
# 行尾由 .gitattributes 固定为 LF；Windows runner 默认 core.autocrlf=true，
# 不固定的话 biome 的 lineEnding lf 会把每个文件判成要格式化。
# action 按 commit SHA 固定（tag 可被移动）；install 显式走 --frozen-lockfile。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:imports
      - run: pnpm typecheck
      - run: pnpm test
